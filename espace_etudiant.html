<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Espace Étudiant - Connexion</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        /* --- CSS GLOBAL --- */
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        body { background: #f4f7fb; color: #333; overflow-x: hidden; }

        @keyframes fadeInUp { from { opacity: 0; transform: translateY(40px); } to { opacity: 1; transform: translateY(0); } }
        @keyframes fadeOut { from { opacity: 1; } to { opacity: 0; visibility: hidden; } }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
        
        .anim-fade-in { animation: fadeInUp 0.8s ease-out forwards; opacity: 0; }

        /* ===================================================== */
        /* --- SPLASH SCREEN --- */
        /* ===================================================== */
        #splash-screen {
            position: fixed;
            top: 0; left: 0; width: 100vw; height: 100vh;
            background: linear-gradient(135deg, #0b2a54 0%, #3b7dd8 100%);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            z-index: 9999;
            color: white;
            text-align: center;
            transition: opacity 1s ease, visibility 1s ease;
        }
        #splash-screen.hidden { animation: fadeOut 1s forwards; }
        #splash-screen h1 { font-size: 48px; margin-bottom: 15px; font-weight: 800; }
        #splash-screen h1 span { color: #ffc107; }
        #splash-screen p { font-size: 18px; opacity: 0.8; margin-bottom: 30px; }
        #splash-screen .loader {
            width: 50px; height: 50px; border: 5px solid rgba(255,255,255,0.2);
            border-top: 5px solid #ffc107; border-radius: 50%;
            animation: spin 1s linear infinite;
        }
        #splash-screen .timer-text { margin-top: 20px; font-size: 14px; opacity: 0.6; letter-spacing: 2px; }

        /* --- HEADER (Sera chargé par JS) --- */

        /* --- FOOTER (Sera chargé par JS) --- */

        /* ===================================================== */
        /* --- DESIGN SPÉCIFIQUE ESPACE ÉTUDIANT --- */
        /* ===================================================== */
        .page-wrapper {
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 80vh;
            padding: 60px 20px;
        }

        .login-card {
            background: #fff;
            border-radius: 30px;
            padding: 50px 40px;
            max-width: 420px;
            width: 100%;
            box-shadow: 0 15px 40px rgba(0,0,0,0.08);
            border: 1px solid #e4e7eb;
            text-align: center;
        }

        .login-card .icon-header {
            font-size: 50px;
            color: #0b2a54;
            background: #eef5ff;
            width: 80px;
            height: 80px;
            border-radius: 50%;
            display: flex;
            justify-content: center;
            align-items: center;
            margin: 0 auto 20px auto;
        }

        .login-card h2 {
            font-size: 26px;
            color: #0b2a54;
            margin-bottom: 5px;
        }

        .login-card p {
            color: #666;
            font-size: 14px;
            margin-bottom: 25px;
        }

        .form-group {
            margin-bottom: 20px;
            text-align: left;
        }

        .form-group label {
            display: block;
            font-size: 13px;
            font-weight: 600;
            color: #333;
            margin-bottom: 5px;
        }

        .form-group input {
            width: 100%;
            padding: 12px 15px;
            border: 1px solid #e4e7eb;
            border-radius: 10px;
            background: #f9f9f9;
            outline: none;
            font-size: 14px;
            transition: 0.3s;
        }

        .form-group input:focus {
            border-color: #007bff;
            background: #fff;
            box-shadow: 0 0 0 4px rgba(0, 123, 255, 0.08);
        }

        .btn-login-submit {
            width: 100%;
            background: #007bff;
            color: #fff;
            padding: 12px;
            border: none;
            border-radius: 30px;
            font-weight: 700;
            font-size: 16px;
            cursor: pointer;
            transition: 0.3s;
            margin-top: 5px;
        }

        .btn-login-submit:hover {
            background: #0056b3;
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(0, 123, 255, 0.2);
        }

        .login-footer-links {
            margin-top: 20px;
            font-size: 13px;
            color: #777;
        }

        .login-footer-links a {
            color: #007bff;
            text-decoration: none;
        }

        .login-footer-links a:hover {
            text-decoration: underline;
        }

        .back-home-btn {
            display: inline-block;
            margin-top: 20px;
            color: #666;
            text-decoration: none;
            font-size: 14px;
            transition: 0.3s;
        }

        .back-home-btn:hover {
            color: #007bff;
            transform: translateX(-5px);
        }

        @media (max-width: 576px) {
            .login-card { padding: 30px 20px; }
        }
    </style>
</head>
<body>

    <!-- SPLASH SCREEN -->
    <div id="splash-screen">
        <h1>Bienvenue dans l'<span>Espace Étudiant</span> !</h1>
        <p>Connectez-vous pour accéder à votre tableau de bord personnalisé.</p>
        <div class="loader"></div>
        <div class="timer-text">Chargement <span id="countdown">4</span>s</div>
    </div>

    <!-- HEADER -->
    <div id="header-container"></div>

    <!-- FORMULAIRE DE CONNEXION -->
    <div class="page-wrapper">
        <div class="login-card anim-fade-in">
            <div class="icon-header">
                <i class="fa-solid fa-graduation-cap"></i>
            </div>
            <h2>Bienvenue</h2>
            <p>Connectez-vous avec votre numéro d'étudiant</p>
            
            <form action="#" method="POST">
                <div class="form-group">
                    <label>Numéro d'étudiant</label>
                    <input type="text" placeholder="Ex: 2024GI001" required>
                </div>
                <div class="form-group">
                    <label>Mot de passe</label>
                    <input type="password" placeholder="••••••••" required>
                </div>
                <button type="submit" class="btn-login-submit">Se connecter <i class="fa-solid fa-arrow-right"></i></button>
            </form>

            <div class="login-footer-links">
                <a href="#">Mot de passe oublié ?</a>
            </div>

            <a href="index.html" class="back-home-btn"><i class="fa-solid fa-arrow-left"></i> Retour à l'accueil</a>
        </div>
    </div>

    <!-- FOOTER -->
    <div id="footer-container"></div>

    <script>
        fetch('header.html').then(r => r.text()).then(d => document.getElementById('header-container').innerHTML = d);
        fetch('footer.html').then(r => r.text()).then(d => document.getElementById('footer-container').innerHTML = d);

        let countdownElement = document.getElementById('countdown');
        let timeLeft = 4;
        const timerInterval = setInterval(() => {
            if(timeLeft > 0) {
                timeLeft--;
                if(countdownElement) countdownElement.textContent = timeLeft;
            }
            if(timeLeft <= 0) {
                clearInterval(timerInterval);
                const splash = document.getElementById('splash-screen');
                splash.classList.add('hidden');
                setTimeout(() => { splash.style.display = 'none'; }, 800);
            }
        }, 1000);
    </script>
</body>
</html>
